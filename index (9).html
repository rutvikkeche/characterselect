<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Select Driver</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="screen">
    <img id="bg" class="bg-image" src="" alt="Driver select background">

    <button id="prevBtn" class="arrow-btn arrow-left" aria-label="Previous driver">
      <svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button id="nextBtn" class="arrow-btn arrow-right" aria-label="Next driver">
      <svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button id="muteBtn" class="sound-btn" aria-label="Toggle music">
      <svg id="soundIcon" viewBox="0 0 24 24"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path id="wave1" d="M16.5 8.5a5 5 0 010 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path id="wave2" d="M19 6a9 9 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <button id="startBtn" class="start-btn">Start</button>
  </div>

  <audio id="bgMusic" src="audio/theme.mp3" loop preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
